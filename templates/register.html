<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — NeuralQuery</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#060810;--surface:#0c0f1a;--surface2:#111627;--border:rgba(99,179,237,0.12);--blue:#4F9CF9;--blue-dim:rgba(79,156,249,0.1);--green:#10B981;--red:#EF4444;--text:#E2E8F0;--muted:#64748B;}
        [data-theme="light"] {
            --bg:#EEF2F7; --surface:#FFFFFF; --surface2:#F4F7FB;
            --border:rgba(100,116,139,0.18); --blue:#2563EB;
            --blue-dim:rgba(37,99,235,0.08); --green:#059669;
            --red:#DC2626; --text:#0F172A; --muted:#475569;
        }
        [data-theme="light"] body::before{background-image:linear-gradient(rgba(37,99,235,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(37,99,235,0.03) 1px,transparent 1px);}
        html,body{transition:background 0.3s,color 0.3s;}

        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--text);min-height:100vh;display:flex;flex-direction:column;}
        body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(79,156,249,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(79,156,249,0.03) 1px,transparent 1px);background-size:60px 60px;pointer-events:none;z-index:0;}
        nav{position:relative;z-index:10;display:flex;align-items:center;padding:0 60px;height:72px;background:rgba(6,8,16,0.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);}
        .logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;}
        .logo-mark{width:36px;height:36px;background:var(--blue-dim);border:1px solid var(--blue);border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:14px;color:var(--blue);}
        .logo-text{font-family:'Syne',sans-serif;font-weight:700;font-size:18px;}
        .main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px;position:relative;z-index:1;}
        .card{width:100%;max-width:460px;background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:48px 40px;box-shadow:0 40px 80px rgba(0,0,0,0.4);}
        .card-header{text-align:center;margin-bottom:36px;}
        .card-icon{width:64px;height:64px;background:var(--blue-dim);border:1px solid rgba(79,156,249,0.3);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 20px;}
        .card-header h2{font-family:'Syne',sans-serif;font-size:1.8rem;font-weight:700;margin-bottom:8px;letter-spacing:-0.5px;}
        .card-header p{color:var(--muted);font-size:14px;}
        .form-group{margin-bottom:18px;}
        label{display:block;font-size:13px;color:var(--muted);margin-bottom:8px;font-weight:500;}
        input{width:100%;padding:12px 16px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;outline:none;transition:border-color 0.2s;}
        input:focus{border-color:var(--blue);}
        input::placeholder{color:var(--muted);}
        .strength-bar{height:3px;background:var(--surface2);border-radius:2px;margin-top:8px;overflow:hidden;}
        .strength-fill{height:100%;width:0%;border-radius:2px;transition:all 0.3s;}
        .strength-text{font-size:11px;margin-top:4px;font-family:'DM Mono',monospace;min-height:14px;}
        .btn-submit{width:100%;padding:13px;background:var(--blue);color:#fff;border:none;border-radius:10px;font-family:'Syne',sans-serif;font-size:15px;font-weight:600;cursor:pointer;transition:all 0.2s;margin-top:8px;}
        .btn-submit:hover{background:#3b8ef0;transform:translateY(-1px);}
        .btn-submit:disabled{opacity:0.6;cursor:not-allowed;transform:none;}
        .card-footer{text-align:center;margin-top:28px;font-size:14px;color:var(--muted);}
        .card-footer a{color:var(--blue);text-decoration:none;font-weight:600;}
        .back-link{display:block;text-align:center;margin-top:16px;font-size:13px;color:var(--muted);text-decoration:none;}
        .alert{padding:12px 16px;border-radius:8px;font-size:13px;margin-bottom:20px;display:none;}
        .alert.error{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:#fca5a5;}
        .alert.success{background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.3);color:#6ee7b7;}
    </style>
    <script src="/static/theme.js"></script>
</head>
<body>
<nav>
    <a href="/" class="logo">
        <div class="logo-mark">NQ</div>
        <div class="logo-text">NeuralQuery</div>
    </a>
</nav>
<main class="main">
    <div class="card">
        <div class="card-header">
            <div class="card-icon">🚀</div>
            <h2>Create Account</h2>
            <p>Join NeuralQuery and start querying in plain English</p>
        </div>
        <div class="alert" id="alertBox"></div>
        <form id="regForm">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="fullname" placeholder="e.g. Jane Smith" required autocomplete="name">
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="you@company.com" required autocomplete="email">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Minimum 8 characters" required autocomplete="new-password">
                <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
                <div class="strength-text" id="strengthLabel"></div>
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" id="confirm_password" placeholder="Re-enter your password" required autocomplete="new-password">
            </div>
            <button type="submit" class="btn-submit" id="submitBtn">Initialize Registration</button>
        </form>
        <div class="card-footer">Already have an account? <a href="/login">Sign In →</a></div>
        <a href="/" class="back-link">← Back to Home</a>
    </div>
</main>
<script src="/static/register.js"></script>
</body>
</html>
