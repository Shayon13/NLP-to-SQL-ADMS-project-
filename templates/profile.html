<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile — NeuralQuery</title>
    <script src="/static/theme.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        :root {
            --bg:#060810; --surface:#0c0f1a; --surface2:#111627;
            --border:rgba(99,179,237,0.12); --blue:#4F9CF9;
            --blue-dim:rgba(79,156,249,0.1); --cyan:#22D3EE;
            --green:#10B981; --red:#EF4444; --amber:#F59E0B;
            --text:#E2E8F0; --muted:#64748B; --dim:#1e293b;
            --shadow: 0 4px 24px rgba(0,0,0,0.4);
        }
        [data-theme="light"] {
            --bg:#EEF2F7; --surface:#FFFFFF; --surface2:#F4F7FB;
            --border:rgba(100,116,139,0.18); --blue:#2563EB;
            --blue-dim:rgba(37,99,235,0.08); --cyan:#0891B2;
            --green:#059669; --red:#DC2626; --amber:#D97706;
            --text:#0F172A; --muted:#475569; --dim:#94A3B8;
            --shadow: 0 4px 24px rgba(15,23,42,0.08);
        }

        *{margin:0;padding:0;box-sizing:border-box;}
        html{transition:background 0.3s,color 0.3s;}
        body{background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--text);min-height:100vh;display:flex;flex-direction:column;transition:background 0.3s,color 0.3s;}
        body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(79,156,249,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(79,156,249,0.03) 1px,transparent 1px);background-size:60px 60px;pointer-events:none;z-index:0;}
        [data-theme="light"] body::before{background-image:linear-gradient(rgba(37,99,235,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(37,99,235,0.03) 1px,transparent 1px);}

        nav{position:relative;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:0 40px;height:64px;background:var(--surface);border-bottom:1px solid var(--border);transition:background 0.3s,border-color 0.3s;}
        .nav-brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);}
        .logo-mark{width:32px;height:32px;background:var(--blue-dim);border:1px solid var(--blue);border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:12px;color:var(--blue);}
        .brand-text{font-family:'Syne',sans-serif;font-weight:700;font-size:17px;}
        .nav-right{display:flex;align-items:center;gap:10px;}
        .back-btn{display:flex;align-items:center;gap:7px;padding:7px 16px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;font-size:13px;color:var(--muted);text-decoration:none;transition:all 0.2s;}
        .back-btn:hover{border-color:var(--blue);color:var(--blue);}
        .settings-link{display:flex;align-items:center;gap:7px;padding:7px 16px;background:var(--blue-dim);border:1px solid rgba(79,156,249,0.2);border-radius:8px;font-size:13px;color:var(--blue);text-decoration:none;transition:all 0.2s;}
        .settings-link:hover{background:rgba(79,156,249,0.15);}

        /* ── Page ── */
        .page{flex:1;position:relative;z-index:1;padding:40px 20px 60px;}
        .page-inner{max-width:680px;margin:0 auto;}

        /* ── Hero Card ── */
        .hero-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;overflow:hidden;margin-bottom:24px;box-shadow:var(--shadow);transition:background 0.3s,border-color 0.3s;}
        .hero-banner{height:96px;background:linear-gradient(135deg, #0d1b3e 0%, #162850 40%, #0d2a42 70%, #081e3f 100%);}
        [data-theme="light"] .hero-banner{background:linear-gradient(135deg,#DBEAFE 0%,#EFF6FF 40%,#E0F2FE 70%,#DBEAFE 100%);}
        .hero-body{padding:0 28px 28px;position:relative;}
        .hero-avatar{width:80px;height:80px;background:linear-gradient(135deg,var(--blue),var(--cyan));border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:700;font-size:28px;color:#fff;border:4px solid var(--surface);margin-top:-40px;margin-bottom:14px;box-shadow:0 4px 16px rgba(79,156,249,0.3);}
        .hero-name{font-family:'Syne',sans-serif;font-size:22px;font-weight:700;letter-spacing:-0.5px;margin-bottom:4px;}
        .hero-email{font-size:13px;color:var(--muted);font-family:'DM Mono',monospace;margin-bottom:16px;}
        .hero-stats{display:flex;gap:24px;}
        .hero-stat{text-align:center;}
        .stat-num{font-family:'Syne',sans-serif;font-size:20px;font-weight:700;color:var(--blue);}
        .stat-lbl{font-size:11px;color:var(--muted);font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:1px;}

        /* ── Form Cards ── */
        .form-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:20px;box-shadow:var(--shadow);transition:background 0.3s,border-color 0.3s;}
        .form-card-head{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid var(--border);}
        .form-card-title{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;}
        .form-card-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;}
        .fc-blue{background:var(--blue-dim);color:var(--blue);}
        .fc-green{background:rgba(16,185,129,0.1);color:var(--green);}
        [data-theme="light"] .fc-green{background:rgba(5,150,105,0.1);}
        .form-card-body{padding:22px 24px;}
        .form-row{margin-bottom:18px;}
        .form-row:last-child{margin-bottom:0;}
        label{display:block;font-size:12px;color:var(--muted);margin-bottom:8px;font-weight:500;font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:0.5px;}
        input[type=text],input[type=email],input[type=password]{width:100%;padding:11px 16px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;outline:none;transition:border-color 0.2s,background 0.3s;}
        input:focus{border-color:var(--blue);}
        input::placeholder{color:var(--muted);}
        input:disabled{opacity:0.5;cursor:not-allowed;}
        .two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;}

        /* ── Password Expand ── */
        .pw-toggle{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--blue);cursor:pointer;background:none;border:none;font-family:'DM Sans',sans-serif;font-weight:500;padding:0;transition:opacity 0.2s;}
        .pw-toggle:hover{opacity:0.8;}
        .pw-fields{display:none;margin-top:18px;padding-top:18px;border-top:1px solid var(--border);}
        .pw-fields.open{display:block;}

        /* ── Buttons ── */
        .btn-save{display:flex;align-items:center;gap:8px;padding:11px 24px;background:var(--blue);color:#fff;border:none;border-radius:10px;font-family:'Syne',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:all 0.2s;}
        .btn-save:hover{background:#3b8ef0;transform:translateY(-1px);}
        .btn-save:disabled{opacity:0.6;cursor:not-allowed;transform:none;}
        .btn-outline{padding:11px 24px;background:transparent;color:var(--muted);border:1px solid var(--border);border-radius:10px;font-family:'DM Sans',sans-serif;font-size:14px;cursor:pointer;transition:all 0.2s;}
        .btn-outline:hover{border-color:var(--blue);color:var(--blue);}
        .form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;}

        /* ── Alert ── */
        .alert{padding:11px 16px;border-radius:8px;font-size:13px;margin-bottom:16px;display:none;}
        .alert.success{background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.3);color:#6ee7b7;}
        .alert.error{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:#fca5a5;}
        [data-theme="light"] .alert.success{color:var(--green);}
        [data-theme="light"] .alert.error{color:var(--red);}

        /* ── Spinner ── */
        @keyframes spin{to{transform:rotate(360deg)}}
        .spin{width:14px;height:14px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.6s linear infinite;display:none;}
    </style>
</head>
<body>
<nav>
    <a href="/dashboard" class="nav-brand">
        <div class="logo-mark">NQ</div>
        <span class="brand-text">NeuralQuery</span>
    </a>
    <div class="nav-right">
        <a href="/settings" class="settings-link"><i class="ri-settings-line"></i> Settings</a>
        <a href="/dashboard" class="back-btn"><i class="ri-arrow-left-line"></i> Dashboard</a>
    </div>
</nav>

<div class="page">
    <div class="page-inner">

        <!-- ── Hero ── -->
        <div class="hero-card">
            <div class="hero-banner"></div>
            <div class="hero-body">
                <div class="hero-avatar" id="heroAvatar">{{ initials }}</div>
                <div class="hero-name" id="heroName">{{ user.fullname }}</div>
                <div class="hero-email">{{ user.email }}</div>
                <div class="hero-stats">
                    <div class="hero-stat">
                        <div class="stat-num" id="statQueries">—</div>
                        <div class="stat-lbl">Queries</div>
                    </div>
                    <div class="hero-stat">
                        <div class="stat-num" id="statDays">—</div>
                        <div class="stat-lbl">Days Active</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ── Edit Profile ── -->
        <div class="form-card">
            <div class="form-card-head">
                <div class="form-card-title">
                    <div class="form-card-icon fc-blue"><i class="ri-user-line"></i></div>
                    Edit Profile
                </div>
            </div>
            <div class="form-card-body">
                <div class="alert" id="profileAlert"></div>
                <div class="form-row">
                    <label>Full Name</label>
                    <input type="text" id="fullname" value="{{ user.fullname }}" placeholder="Your full name">
                </div>
                <div class="form-row">
                    <label>Email Address</label>
                    <input type="email" id="email" value="{{ user.email }}" disabled title="Email cannot be changed">
                </div>
                <div class="form-actions">
                    <button class="btn-outline" onclick="resetProfileForm()">Reset</button>
                    <button class="btn-save" id="saveProfileBtn" onclick="saveProfile()">
                        <div class="spin" id="profileSpin"></div>
                        <span id="saveProfileText">Save Changes</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- ── Change Password ── -->
        <div class="form-card">
            <div class="form-card-head">
                <div class="form-card-title">
                    <div class="form-card-icon fc-green"><i class="ri-lock-password-line"></i></div>
                    Security
                </div>
                <button class="pw-toggle" id="pwToggleBtn" onclick="togglePasswordSection()">
                    <i class="ri-add-circle-line" id="pwToggleIcon"></i>
                    <span id="pwToggleText">Change Password</span>
                </button>
            </div>
            <div class="form-card-body">
                <div id="pwFields" class="pw-fields">
                    <div class="alert" id="passwordAlert"></div>
                    <div class="form-row">
                        <label>Current Password</label>
                        <input type="password" id="currentPassword" placeholder="Enter your current password">
                    </div>
                    <div class="two-col">
                        <div class="form-row">
                            <label>New Password</label>
                            <input type="password" id="newPassword" placeholder="Min. 8 characters">
                        </div>
                        <div class="form-row">
                            <label>Confirm New Password</label>
                            <input type="password" id="confirmPassword" placeholder="Repeat new password">
                        </div>
                    </div>
                    <div class="form-actions">
                        <button class="btn-outline" onclick="clearPasswordFields()">Cancel</button>
                        <button class="btn-save" id="savePasswordBtn" onclick="savePassword()">
                            <div class="spin" id="passwordSpin"></div>
                            <span id="savePasswordText">Update Password</span>
                        </button>
                    </div>
                </div>
                <p id="pwPlaceholder" style="font-size:13px;color:var(--muted);">Your password is securely hashed. Click <strong style="color:var(--text)">Change Password</strong> to update it.</p>
            </div>
        </div>

    </div>
</div>

<script>
    const ORIGINAL_NAME = {{ user.fullname | tojson }};
</script>
<script src="/static/profile.js"></script>
</body>
</html>
